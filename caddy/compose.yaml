services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    # Host network lets Caddy reach all services via 127.0.0.1:PORT
    # No need to modify other compose files
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
      - ./config:/config
